services:
  procuraduria:
    build:
      context: "./APi Procuraduria, multas, sanciones y obras inconclusas"
    image: johpaz/secop-procuraduria:latest
    environment:
      - PORT=3000
      # La base vive en un volumen de directorio; si está vacía se auto-seedea desde los CSV
      - DATA_DB_PATH=/app/data/data.db
      # Actualización semanal desde datos.gov.co (SIRI, multas SECOP, SIC). El estado persiste en la base
      - REFRESH_INTERVAL_DAYS=${REFRESH_INTERVAL_DAYS:-7}
      # Habilita POST /admin/refresh (Authorization: Bearer <token>); sin valor el endpoint responde 503
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      - ./data/procuraduria:/app/data
    restart: unless-stopped
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: johpaz/secop-api:latest
    depends_on:
      - procuraduria
    environment:
      - SOCRATA_APP_TOKEN=${SOCRATA_APP_TOKEN}
      - PORT=3001
      - CACHE_TTL=300
      - PROCURADURIA_URL=http://procuraduria:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3-flash-preview}
      - HIVE_HOME=/app/hive-data
      - HIVE_MASTER_KEY=${HIVE_MASTER_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WHATSAPP_ENABLED=${WHATSAPP_ENABLED:-false}
      # Directorio (no archivo): evita que Docker cree un directorio-fantasma
      # cuando el .db no existe, y los sidecars WAL quedan dentro del volumen
      - ANTICORRUP_DB_PATH=/app/data/anticorrup.db
    volumes:
      - ./data/api:/app/data
      - ./hive-data:/app/hive-data
    restart: unless-stopped
    networks:
      backend:
        aliases:
          - observatorio-api

  frontend:
    build:
      context: ./frontend
    image: johpaz/secop-frontend:latest
    depends_on:
      - api
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_evoapi
      - traefik.http.routers.observatorio.rule=Host(`${DASHBOARD_DOMAIN}`)
      - traefik.http.routers.observatorio.entrypoints=web,websecure
      - traefik.http.routers.observatorio.tls=true
      - traefik.http.routers.observatorio.tls.certresolver=mytlschallenge
      - traefik.http.routers.observatorio.middlewares=observatorio-headers@docker
      - traefik.http.middlewares.observatorio-headers.headers.SSLRedirect=true
      - traefik.http.middlewares.observatorio-headers.headers.STSSeconds=315360000
      - traefik.http.services.observatorio.loadbalancer.server.port=80
    networks:
      - backend
      - n8n_evoapi

networks:
  # Red interna: procuraduria <-> api <-> frontend (nginx). Sin Traefik ni n8n
  backend:
  # Red compartida con Traefik; solo el frontend se une
  n8n_evoapi:
    external: true
